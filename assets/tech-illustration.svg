<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(800 300) rotate(90) scale(260 260)">
      <stop stop-color="#4f46e5" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f46e5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <!-- Grid -->
  <g opacity="0.25" stroke="#1f2a44" stroke-width="1">
    <path d="M0 100H1200M0 200H1200M0 300H1200M0 400H1200M0 500H1200M0 600H1200M0 700H1200M0 800H1200"/>
    <path d="M100 0V900M200 0V900M300 0V900M400 0V900M500 0V900M600 0V900M700 0V900M800 0V900M900 0V900M1000 0V900M1100 0V900"/>
  </g>
  <!-- Circuit lines -->
  <g stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
    <path d="M160 740h180c30 0 40-24 40-40v-60c0-18 12-28 28-28h110c18 0 28-12 28-28v-48c0-18 12-28 28-28h120"/>
    <path d="M160 640h120c18 0 28-12 28-28v-36c0-18 12-28 28-28h160" opacity="0.8"/>
    <path d="M640 560h120c18 0 28-12 28-28v-60c0-18 12-28 28-28h160" opacity="0.8"/>
  </g>
  <!-- Nodes -->
  <g>
    <circle cx="160" cy="740" r="6" fill="#22d3ee"/>
    <circle cx="520" cy="612" r="6" fill="#22d3ee"/>
    <circle cx="760" cy="504" r="6" fill="#22d3ee"/>
    <circle cx="960" cy="416" r="6" fill="#22d3ee"/>
  </g>
  <!-- Abstract device -->
  <g filter="url(#shadow)">
    <rect x="720" y="180" width="360" height="220" rx="16" fill="#0f172a" stroke="#2a3553"/>
    <rect x="740" y="200" width="320" height="28" rx="6" fill="#141e33"/>
    <circle cx="752" cy="214" r="6" fill="#ef4444"/>
    <circle cx="770" cy="214" r="6" fill="#f59e0b"/>
    <circle cx="788" cy="214" r="6" fill="#22c55e"/>
    <rect x="740" y="242" width="150" height="12" rx="6" fill="#4f46e5"/>
    <rect x="740" y="268" width="280" height="12" rx="6" fill="#94a3b8"/>
    <rect x="740" y="292" width="260" height="12" rx="6" fill="#94a3b8"/>
    <rect x="740" y="316" width="220" height="12" rx="6" fill="#94a3b8"/>
  </g>
  <!-- Glow -->
  <circle cx="800" cy="300" r="260" fill="url(#glow)"/>
  
  <style>
    #shadow { filter: drop-shadow(0 10px 30px rgba(0,0,0,0.35)); }
  </style>
</svg>
