<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" fill="none">
  <defs>
    <linearGradient id="indigo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="rgba(2,6,23,0.08)"/>
    </filter>
  </defs>
  <!-- Light card background -->
  <rect width="256" height="256" rx="40" fill="#ffffff"/>

  <!-- Accent dots for personality -->
  <circle cx="38" cy="36" r="10" fill="#c7d2fe" opacity="0.8"/>
  <circle cx="220" cy="40" r="8" fill="#a5b4fc" opacity="0.8"/>

  <!-- Monogram: ring + stacked bars to suggest "Stack" -->
  <g filter="url(#softShadow)">
    <!-- Ring -->
    <circle cx="128" cy="128" r="76" fill="none" stroke="url(#indigo)" stroke-width="12"/>
    <!-- Stacked bars -->
    <rect x="84" y="98" width="88" height="18" rx="9" fill="url(#indigo)"/>
    <rect x="84" y="128" width="88" height="18" rx="9" fill="url(#indigo)" opacity="0.9"/>
    <rect x="84" y="158" width="88" height="18" rx="9" fill="url(#indigo)" opacity="0.8"/>
  </g>

  <!-- Subtle baseline -->
  <path d="M64 196c26 10 68 10 96 0" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round"/>
</svg>
